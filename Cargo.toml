[package]
name = "podbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Secure, reproducible per-workspace dev sandbox — an OCI/Podman interface backed by KVM-class microVMs, hardened for running untrusted code and coding AI agents."
repository = "https://github.com/gubasso/podbox"
readme = "README.md"
keywords = ["sandbox", "microvm", "ai-agents", "devcontainer", "podman"]
categories = ["command-line-utilities", "development-tools", "virtualization"]
# Keep the published .crate lean: ship only what builds the binary (src/ + Cargo.toml
# + Cargo.lock) plus README/LICENSE for the crates.io page. Project docs live in the
# repo (see `repository`); dev/CI tooling is not a build input. Review this list
# whenever a new top-level config artifact is added — see CLAUDE.md.
exclude = [
  "/docs",
  "/tests",
  "/CLAUDE.md",
  "/.github",
  "/.gitignore",
  "/scripts",
  "/.config",
  "/.direnv",
  "/flake.nix",
  "/flake.lock",
  "/.envrc",
  "/.editorconfig",
  "/.pre-commit-config.yaml",
  "/deny.toml",
  "/committed.toml",
  "/dist-workspace.toml",
  "/release-plz.toml",
  "/justfile",
  "/rust-toolchain.toml",
]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.103"
camino = "1.2.4"
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
fs4 = "1.1.0"
hex = "0.4.3"
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
supports-color = "3.0.2"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "macros"] }
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json"] }
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"
